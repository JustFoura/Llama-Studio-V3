name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        run: npm ci --prefix app
      - name: Test Rust backend
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
      - name: Lint Rust backend
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Check frontend syntax
        run: node --check app/src/main.js
      - name: Test throughput parsing
        run: npm run test:ui --prefix app
      - name: Build Debian package
        run: npm run tauri --prefix app -- build --bundles deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        run: npm ci --prefix app
      - name: Test Windows Rust build
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
      - name: Lint Windows Rust build
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Check frontend syntax
        run: node --check app/src/main.js
      - name: Test throughput parsing
        run: npm run test:ui --prefix app
